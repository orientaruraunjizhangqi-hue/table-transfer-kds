<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>卓移動プッシュオーダーシステム (Table Transfer KDS)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .touch-none { touch-action: none; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        @keyframes pulse-red {
            0%, 100% { border-color: rgba(239, 68, 68, 0.9); box-shadow: 0 0 18px rgba(239, 68, 68, 0.4); }
            50% { border-color: rgba(239, 68, 68, 0.3); box-shadow: 0 0 6px rgba(239, 68, 68, 0.15); }
        }
        .urgency-danger { animation: pulse-red 1.5s infinite; }
        
        .bg-ticket-grid {
            background-size: 16px 16px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col h-screen overflow-hidden select-none">

    <!-- Header Navigation -->
    <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex-none flex items-center justify-between shadow-lg z-20">
        <!-- Brand & Clock -->
        <div class="flex items-center space-x-3">
            <div class="bg-amber-500 text-slate-950 p-2 rounded-xl font-extrabold flex items-center justify-center shadow-md shadow-amber-500/20">
                <i data-lucide="arrow-right-left" class="w-6 h-6"></i>
            </div>
            <div>
                <div class="flex items-center space-x-2">
                    <h1 class="font-black text-slate-100 text-base sm:text-lg tracking-wide">卓移動 KDS</h1>
                    <span class="text-[10px] bg-slate-800 text-amber-400 font-bold px-2 py-0.5 rounded border border-slate-700">商品: 移動</span>
                </div>
                <div class="flex items-center space-x-2 text-xs">
                    <span id="syncStatus" class="flex items-center text-slate-400 font-medium" title="端末間同期の状態">
                        <span id="syncDot" class="w-2 h-2 rounded-full bg-slate-500 animate-pulse mr-1.5"></span>
                        <span id="syncText">接続中…</span>
                    </span>
                    <span class="text-slate-600">•</span>
                    <span id="clock" class="font-mono text-slate-400 font-semibold">00:00:00</span>
                </div>
            </div>
        </div>

        <!-- View Switcher Tabs -->
        <div class="flex items-center bg-slate-950 p-1 rounded-xl border border-slate-800">
            <button onclick="switchMainTab('ACTIVE')" id="tabBtnActive" class="px-4 py-2 rounded-lg text-xs font-bold transition-all bg-amber-500 text-slate-950 shadow flex items-center gap-1.5">
                <i data-lucide="arrow-right-left" class="w-4 h-4"></i>
                <span>移動待ち伝票</span>
                <span id="activeBadge" class="ml-1 bg-slate-950 text-amber-400 text-[10px] px-1.5 py-0.2 rounded-full font-black">0</span>
            </button>
            <button onclick="switchMainTab('COMPLETED')" id="tabBtnCompleted" class="px-4 py-2 rounded-lg text-xs font-bold transition-all text-slate-400 hover:text-slate-200 flex items-center gap-1.5">
                <i data-lucide="check-circle-2" class="w-4 h-4"></i>
                <span>移動完了・履歴</span>
                <span id="completedBadge" class="ml-1 bg-slate-800 text-slate-300 text-[10px] px-1.5 py-0.2 rounded-full">0</span>
            </button>
        </div>

        <!-- Action Controls -->
        <div class="flex items-center space-x-2">
            <!-- Table Management Opener -->
            <button onclick="openTableMgmtModal()" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl border border-slate-700 text-xs font-bold transition-colors flex items-center gap-1.5" title="卓色分け・削除・追加">
                <i data-lucide="palette" class="w-4 h-4 text-amber-400"></i>
                <span class="hidden md:inline">卓設定 & 色分け</span>
            </button>

            <!-- Sound Toggle -->
            <button id="soundToggleBtn" onclick="toggleSound()" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl border border-slate-700 transition-colors" title="通知音切替">
                <i data-lucide="volume-2" id="soundIcon" class="w-5 h-5 text-emerald-400"></i>
            </button>

            <!-- Auto Push Simulation Toggle -->
            <button id="simToggleBtn" onclick="togglePushSimulation()" class="flex items-center space-x-1.5 px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl border border-slate-700 text-xs font-medium transition-colors">
                <i data-lucide="radio" id="simIcon" class="w-4 h-4 text-slate-400"></i>
                <span class="hidden md:inline">デモ移動:</span>
                <span id="simStatusText" class="font-bold text-slate-400">OFF</span>
            </button>

            <!-- Add Transfer Order Modal Opener -->
            <button onclick="openOrderModal()" class="flex items-center space-x-1.5 px-4 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 rounded-xl font-black text-xs shadow-lg shadow-amber-500/20 transition-all transform active:scale-95">
                <i data-lucide="plus-circle" class="w-4.5 h-4.5"></i>
                <span>移動オーダー発行</span>
            </button>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 p-4 overflow-y-auto bg-slate-950 relative">
        
        <!-- View 1: Active KDS Board -->
        <div id="viewActive" class="space-y-4">
            <div id="activeGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 pb-12">
                <!-- Active order cards -->
            </div>

            <!-- Empty Active State -->
            <div id="emptyActive" class="hidden absolute inset-0 flex flex-col items-center justify-center text-center p-6 pointer-events-none">
                <div class="bg-slate-900 border border-slate-800 p-8 rounded-3xl max-w-sm flex flex-col items-center shadow-2xl">
                    <div class="p-4 bg-slate-800/80 text-emerald-400 rounded-2xl mb-4">
                        <i data-lucide="check-check" class="w-12 h-12"></i>
                    </div>
                    <h3 class="text-slate-200 font-bold text-lg mb-1">移動待ちの伝票はありません</h3>
                    <p class="text-slate-500 text-xs mb-4">すべての卓移動が完了しています。「移動オーダー発行」で登録してください。</p>
                    <button onclick="simulateIncomingPush()" class="pointer-events-auto px-4 py-2 bg-slate-800 hover:bg-slate-700 text-amber-400 border border-amber-500/30 rounded-xl text-xs font-bold transition-colors">
                        テスト移動オーダー送信
                    </button>
                </div>
            </div>
        </div>

        <!-- View 2: Simplified Completed Orders View -->
        <div id="viewCompleted" class="hidden space-y-4 max-w-5xl mx-auto pb-12">
            <!-- Completed Summary & Search Filter Bar -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col sm:flex-row items-center justify-between gap-3 shadow-lg">
                <div class="flex items-center space-x-3 w-full sm:w-auto">
                    <div class="p-2.5 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-xl">
                        <i data-lucide="clipboard-check" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <h2 class="text-sm font-bold text-slate-200">移動完了履歴</h2>
                        <p class="text-xs text-slate-400">完了数: <span id="completedTodayCount" class="font-bold text-emerald-400">0</span> 件</p>
                    </div>
                </div>

                <!-- Quick Filter / Search -->
                <div class="relative w-full sm:w-64">
                    <i data-lucide="search" class="w-4 h-4 text-slate-500 absolute left-3 top-3"></i>
                    <input type="text" id="completedSearchInput" oninput="renderCompletedOrders()" placeholder="卓番号やメモで検索..." class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-9 pr-3 py-2 text-xs text-slate-200 outline-none focus:border-amber-500 transition-colors">
                </div>
            </div>

            <!-- Completed List -->
            <div id="completedList" class="space-y-2.5">
                <!-- Completed order items rendered here -->
            </div>

            <!-- Empty Completed State -->
            <div id="emptyCompleted" class="hidden text-center py-16 text-slate-500">
                <i data-lucide="inbox" class="w-12 h-12 mx-auto mb-2 text-slate-700"></i>
                <p class="text-xs font-medium">完了した移動伝票の履歴はありません</p>
            </div>
        </div>
    </main>

    <!-- Table Management, Palette & Deletion Modal -->
    <div id="tableMgmtModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-5 space-y-4 shadow-2xl">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <div class="flex items-center space-x-2">
                    <i data-lucide="palette" class="w-5 h-5 text-amber-400"></i>
                    <h2 class="font-bold text-slate-100 text-base">卓設定 (色分け & 削除・追加)</h2>
                </div>
                <button onclick="closeTableMgmtModal()" class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Add Table -->
            <div>
                <label class="block text-xs font-bold text-slate-400 mb-1.5">新しい卓番号を追加</label>
                <div class="flex gap-2">
                    <input type="text" id="modalAddTableInput" placeholder="例: 7, VIP2, カウンター3" class="flex-1 bg-slate-950 border border-slate-800 focus:border-amber-500 rounded-xl px-3 py-2 text-xs text-slate-100 outline-none">
                    <button type="button" onclick="handleAddTableFromMgmt()" class="px-4 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs rounded-xl shadow-md flex items-center gap-1">
                        <i data-lucide="plus" class="w-4 h-4"></i> 追加
                    </button>
                </div>
            </div>

            <!-- Existing Tables List with Color Picker & Delete button -->
            <div>
                <div class="flex items-center justify-between mb-1.5">
                    <label class="block text-xs font-bold text-slate-400">登録済みの卓 (カラー変更 / 削除)</label>
                    <span class="text-[10px] text-slate-500">パレットから色を選んで個別に設定可能</span>
                </div>
                <div id="mgmtTablesGrid" class="space-y-2 max-h-72 overflow-y-auto p-2 bg-slate-950 rounded-xl border border-slate-800">
                    <!-- Table deletion chips rendered dynamically -->
                </div>
            </div>

            <div class="pt-2 border-t border-slate-800 flex justify-end">
                <button onclick="closeTableMgmtModal()" class="px-5 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-xs font-bold">
                    閉じる
                </button>
            </div>
        </div>
    </div>

    <!-- Simplified Transfer Order Entry Modal -->
    <div id="orderModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-3 sm:p-4 z-50 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full max-h-[92vh] flex flex-col shadow-2xl overflow-hidden">
            
            <!-- Modal Header -->
            <div class="bg-slate-800/60 px-5 py-3 border-b border-slate-800 flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <i data-lucide="arrow-right-left" class="w-5 h-5 text-amber-400"></i>
                    <h2 class="font-bold text-slate-100 text-base">卓移動オーダー発行</h2>
                </div>
                <button onclick="closeOrderModal()" class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Modal Content Body -->
            <div class="flex-1 overflow-y-auto p-4 space-y-4">

                <!-- Gender Selector Section -->
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1.5">
                        1. 移動対象（性別）を選択 <span class="text-slate-500 font-normal">※背景色が変化します</span>
                    </label>
                    <div class="grid grid-cols-2 gap-3">
                        <button type="button" onclick="selectGender('男性')" id="genderBtnMale" class="py-3 px-3 rounded-xl border font-bold text-xs flex items-center justify-center gap-2 transition-all">
                            <span class="text-base">👨</span>
                            <span class="text-sm">男性 (青背景)</span>
                        </button>
                        <button type="button" onclick="selectGender('女性')" id="genderBtnFemale" class="py-3 px-3 rounded-xl border font-bold text-xs flex items-center justify-center gap-2 transition-all">
                            <span class="text-base">👩</span>
                            <span class="text-sm">女性 (ピンク背景)</span>
                        </button>
                    </div>
                </div>

                <!-- Step 2: Select "From Table" -->
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1.5 flex items-center justify-between">
                        <span>2. 移動前の卓を選択 (移動元)</span>
                        <span id="fromSelectedBadge" class="text-amber-400 font-mono font-bold">未選択</span>
                    </label>
                    <div id="fromTableButtons" class="grid grid-cols-3 sm:grid-cols-4 gap-2 max-h-32 overflow-y-auto p-1.5 bg-slate-950 rounded-xl border border-slate-800">
                        <!-- Table chips -->
                    </div>
                </div>

                <!-- Arrow Indicator -->
                <div class="flex justify-center my-0.5">
                    <div class="bg-amber-500/10 text-amber-400 border border-amber-500/20 px-3 py-1 rounded-full text-xs font-bold flex items-center gap-1">
                        <i data-lucide="arrow-down" class="w-4 h-4"></i> 移動
                    </div>
                </div>

                <!-- Step 3: Select "To Table" -->
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1.5 flex items-center justify-between">
                        <span>3. 行き先の卓を選択 (移動先)</span>
                        <span id="toSelectedBadge" class="text-emerald-400 font-mono font-bold">未選択</span>
                    </label>
                    <div id="toTableButtons" class="grid grid-cols-3 sm:grid-cols-4 gap-2 max-h-32 overflow-y-auto p-1.5 bg-slate-950 rounded-xl border border-slate-800">
                        <!-- Table chips -->
                    </div>
                </div>

                <!-- Handdrawn Note or Keyboard Text Note Selector -->
                <div class="border border-slate-800 rounded-xl bg-slate-950/50 overflow-hidden">
                    <!-- Note Input Mode Switcher Header -->
                    <div class="px-3 py-2 bg-slate-950 border-b border-slate-800 flex items-center justify-between">
                        <span class="text-xs font-bold text-amber-400 flex items-center gap-1.5">
                            <i data-lucide="file-text" class="w-4 h-4"></i> 指示メモ (オプション)
                        </span>
                        <div class="flex items-center bg-slate-900 p-0.5 rounded-lg border border-slate-800">
                            <button type="button" onclick="switchNoteMode('text')" id="noteTabBtnText" class="px-3 py-1 rounded-md text-xs font-bold transition-all bg-amber-500 text-slate-950 flex items-center gap-1">
                                <i data-lucide="keyboard" class="w-3.5 h-3.5"></i> テキスト
                            </button>
                            <button type="button" onclick="switchNoteMode('canvas')" id="noteTabBtnCanvas" class="px-3 py-1 rounded-md text-xs font-bold transition-all text-slate-400 hover:text-slate-200 flex items-center gap-1">
                                <i data-lucide="pen-tool" class="w-3.5 h-3.5"></i> 手書き
                            </button>
                        </div>
                    </div>

                    <!-- Mode A: Textarea -->
                    <div id="noteModeText" class="p-3">
                        <textarea id="textNoteInput" rows="2" placeholder="例: お冷のおかわり準備、荷物カゴの移動をお願いします" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-100 placeholder-slate-600 outline-none focus:border-amber-500 transition-colors resize-none"></textarea>
                    </div>

                    <!-- Mode B: Handwriting Canvas -->
                    <div id="noteModeCanvas" class="hidden p-3 space-y-2">
                        <div class="flex items-center justify-between bg-slate-900 p-1.5 rounded-lg border border-slate-800">
                            <div class="flex items-center space-x-2">
                                <button onclick="setModalPenColor('#f87171')" class="modal-color-btn w-5 h-5 rounded-full bg-red-400 ring-2 ring-amber-400 ring-offset-1 ring-offset-slate-900" data-color="#f87171"></button>
                                <button onclick="setModalPenColor('#fbbf24')" class="modal-color-btn w-5 h-5 rounded-full bg-amber-400" data-color="#fbbf24"></button>
                                <button onclick="setModalPenColor('#60a5fa')" class="modal-color-btn w-5 h-5 rounded-full bg-blue-400" data-color="#60a5fa"></button>
                                <button onclick="setModalPenColor('#f8fafc')" class="modal-color-btn w-5 h-5 rounded-full bg-slate-100" data-color="#f8fafc"></button>
                            </div>
                            <div class="flex items-center space-x-1">
                                <button onclick="setModalTool('eraser')" id="modalEraserBtn" class="p-1 text-slate-400 hover:text-slate-100 rounded" title="消しゴム">
                                    <i data-lucide="eraser" class="w-4 h-4"></i>
                                </button>
                                <button onclick="clearModalCanvas()" class="p-1 text-slate-400 hover:text-red-400 rounded" title="消去">
                                    <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>

                        <div class="h-24 bg-slate-950 rounded-xl border border-slate-800 relative overflow-hidden bg-ticket-grid">
                            <canvas id="ticketCanvas" class="w-full h-full touch-none cursor-crosshair block"></canvas>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Modal Footer -->
            <div class="bg-slate-800/60 px-5 py-3 border-t border-slate-800 flex items-center justify-end space-x-3">
                <button onclick="closeOrderModal()" class="px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-bold transition-colors">
                    キャンセル
                </button>
                <button onclick="submitTransferOrder()" class="flex-1 sm:flex-none px-6 py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 rounded-xl text-sm font-black shadow-lg shadow-amber-500/20 transition-all flex items-center justify-center gap-1.5">
                    <i data-lucide="send" class="w-4 h-4"></i>
                    <span>移動指示送信</span>
                </button>
            </div>

        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 border border-slate-700 text-slate-100 px-4 py-3 rounded-2xl shadow-2xl flex items-center space-x-3 text-xs transform translate-y-20 opacity-0 transition-all duration-300 z-50 pointer-events-none">
        <div class="p-1.5 bg-amber-500/20 text-amber-400 rounded-xl">
            <i data-lucide="bell" class="w-4 h-4"></i>
        </div>
        <div>
            <div id="toastTitle" class="font-bold text-slate-200">通知</div>
            <div id="toastMsg" class="text-slate-400 text-[11px]">メッセージ本文</div>
        </div>
    </div>

    <!-- Application Script Logic -->
    <script>
        // Preset Palette Colors for Table Distinction
        const COLOR_PRESETS = [
            { id: 'amber', name: 'Amber', bg: 'bg-amber-500/20', border: 'border-amber-500/60', text: 'text-amber-300', dot: '#f59e0b' },
            { id: 'emerald', name: 'Emerald', bg: 'bg-emerald-500/20', border: 'border-emerald-500/60', text: 'text-emerald-300', dot: '#10b981' },
            { id: 'cyan', name: 'Cyan', bg: 'bg-cyan-500/20', border: 'border-cyan-500/60', text: 'text-cyan-300', dot: '#06b6d4' },
            { id: 'purple', name: 'Purple', bg: 'bg-purple-500/20', border: 'border-purple-500/60', text: 'text-purple-300', dot: '#a855f7' },
            { id: 'rose', name: 'Rose', bg: 'bg-rose-500/20', border: 'border-rose-500/60', text: 'text-rose-300', dot: '#f43f5e' },
            { id: 'indigo', name: 'Indigo', bg: 'bg-indigo-500/20', border: 'border-indigo-500/60', text: 'text-indigo-300', dot: '#6366f1' },
            { id: 'orange', name: 'Orange', bg: 'bg-orange-500/20', border: 'border-orange-500/60', text: 'text-orange-300', dot: '#f97316' },
            { id: 'slate', name: 'Slate', bg: 'bg-slate-800', border: 'border-slate-700', text: 'text-slate-300', dot: '#64748b' }
        ];

        // Registered Tables Array with Individual Color IDs
        // (初期値。Firestore に卓設定がまだ無い場合はこの内容で作成されます)
        const DEFAULT_TABLES = [
            { name: '1', colorId: 'amber' },
            { name: '2', colorId: 'cyan' },
            { name: '3', colorId: 'purple' },
            { name: '4', colorId: 'emerald' },
            { name: '5', colorId: 'rose' },
            { name: '6', colorId: 'indigo' },
            { name: 'カウンター1', colorId: 'orange' },
            { name: 'カウンター2', colorId: 'slate' }
        ];
        let registeredTables = DEFAULT_TABLES.map(t => ({ ...t }));

        // State
        let orders = [];
        let currentTab = 'ACTIVE';
        let soundEnabled = true;
        let isSimulating = false;
        let autoPushInterval = null;

        // Selection State
        let selectedGender = '男性';
        let selectedFromTable = '1';
        let selectedToTable = '3';
        let activeNoteMode = 'text'; // 'text' | 'canvas'

        // Modal Canvas State
        const ticketCanvas = document.getElementById('ticketCanvas');
        const ticketCtx = ticketCanvas.getContext('2d');
        let isDrawing = false;
        let modalPenColor = '#f87171';
        let modalPenWidth = 4;
        let modalTool = 'pen';
        let lastPt = { x: 0, y: 0 };

        window.onload = function() {
            lucide.createIcons();
            startClock();
            initModalCanvas();
            // デモデータは使わず、Firestore からのデータ受信で描画します
            renderAllViews();

            setInterval(updateTimersUI, 1000);
        };

        // ===== 端末間同期 (Firestore) との橋渡し =====
        // 下部の <script type="module"> から呼ばれます。
        // window.SyncApi : addOrder(order) / updateOrder(id, patch) / saveTables(tables)

        // Firestore から全オーダーを受信
        function applyRemoteOrders(list) {
            orders = list;
            renderAllViews();
        }

        // Firestore から卓設定を受信
        function applyRemoteTables(tables) {
            registeredTables = tables;
            if (!registeredTables.some(t => t.name === selectedFromTable)) {
                selectedFromTable = registeredTables[0] ? registeredTables[0].name : '';
            }
            if (!registeredTables.some(t => t.name === selectedToTable)) {

        // Web Audio Synthesizer sound generator
        function playChime(type = 'push') {
            if (!soundEnabled) return;
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'push') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                    osc.frequency.setValueAtTime(880, ctx.currentTime + 0.12);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                } else if (type === 'complete') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
                    osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.5);
                }
            } catch (e) {}
        }

        function createSampleCanvasData(text, color) {
            const c = document.createElement('canvas');
            c.width = 300;
            c.height = 100;
            const ctx = c.getContext('2d');
            ctx.fillStyle = color;
            ctx.font = 'bold 16px sans-serif';
            ctx.fillText(text, 15, 45);
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(10, 55);
            ctx.lineTo(290, 55);
            ctx.stroke();
            return c.toDataURL();
        }

            registeredTables = registeredTables.filter(t => t.name !== tblName);
            window.SyncApi.saveTables(registeredTables);
            
            if (selectedFromTable === tblName) {
                selectedFromTable = registeredTables.length > 0 ? registeredTables[0].name : '';

            if (selectedToTable === tblName) {
                selectedToTable = registeredTables.length > 1 ? registeredTables[1].name : (registeredTables[0] ? registeredTables[0].name : '');

            fromContainer.innerHTML = '';
            toContainer.innerHTML = '';

            if (registeredTables.length === 0) {
                fromContainer.innerHTML = `<div class="col-span-full text-center py-2 text-xs text-slate-500">卓が登録されていません</div>`;
                toContainer.innerHTML = `<div class="col-span-full text-center py-2 text-xs text-slate-500">卓が登録されていません</div>`;
                return;
            }

            registeredTables.forEach(tblObj => {
                const tbl = tblObj.name;
                const colorObj = getTableColorObj(tbl);

                // From Table Button
                const btnFrom = document.createElement('button');
                btnFrom.type = 'button';
                btnFrom.onclick = () => selectFromTable(tbl);
                btnFrom.className = selectedFromTable === tbl
                    ? `px-2.5 py-2 rounded-xl border-2 font-black font-mono text-xs shadow-md ${colorObj.bg} ${colorObj.border} ${colorObj.text} ring-2 ring-amber-400`
                    : `px-2.5 py-2 rounded-xl border font-bold font-mono text-xs opacity-70 hover:opacity-100 ${colorObj.bg} ${colorObj.border} ${colorObj.text}`;
                btnFrom.textContent = `卓 ${tbl}`;
                fromContainer.appendChild(btnFrom);

                // To Table Button
                const btnTo = document.createElement('button');
                btnTo.type = 'button';
                btnTo.onclick = () => selectToTable(tbl);
                btnTo.className = selectedToTable === tbl
                    ? `px-2.5 py-2 rounded-xl border-2 font-black font-mono text-xs shadow-md ${colorObj.bg} ${colorObj.border} ${colorObj.text} ring-2 ring-emerald-400`
                    : `px-2.5 py-2 rounded-xl border font-bold font-mono text-xs opacity-70 hover:opacity-100 ${colorObj.bg} ${colorObj.border} ${colorObj.text}`;
                btnTo.textContent = `卓 ${tbl}`;
                toContainer.appendChild(btnTo);
            });

            document.getElementById('fromSelectedBadge').textContent = selectedFromTable ? `卓 ${selectedFromTable}` : '未選択';
            document.getElementById('toSelectedBadge').textContent = selectedToTable ? `卓 ${selectedToTable}` : '未選択';
        }

        function selectFromTable(tbl) {
            selectedFromTable = tbl;
            renderTableButtons();
        }

        function selectToTable(tbl) {
            selectedToTable = tbl;
            renderTableButtons();
        }

        // Note Input Switcher Logic
        function switchNoteMode(mode) {
            activeNoteMode = mode;
            const btnText = document.getElementById('noteTabBtnText');
            const btnCanvas = document.getElementById('noteTabBtnCanvas');
            const secText = document.getElementById('noteModeText');
            const secCanvas = document.getElementById('noteModeCanvas');

            if (mode === 'text') {
                btnText.className = "px-3 py-1 rounded-md text-xs font-bold transition-all bg-amber-500 text-slate-950 flex items-center gap-1 shadow";
                btnCanvas.className = "px-3 py-1 rounded-md text-xs font-bold transition-all text-slate-400 hover:text-slate-200 flex items-center gap-1";
                secText.classList.remove('hidden');
                secCanvas.classList.add('hidden');
            } else {
                btnText.className = "px-3 py-1 rounded-md text-xs font-bold transition-all text-slate-400 hover:text-slate-200 flex items-center gap-1";
                btnCanvas.className = "px-3 py-1 rounded-md text-xs font-bold transition-all bg-amber-500 text-slate-950 flex items-center gap-1 shadow";
                secText.classList.add('hidden');
                secCanvas.classList.remove('hidden');
                setTimeout(resizeModalCanvas, 50);
            }
        }

        // Modal Order Entry Operations
        function openOrderModal() {
            renderTableButtons();
            clearModalCanvas();
            document.getElementById('textNoteInput').value = '';
            switchNoteMode('text');
            document.getElementById('orderModal').classList.remove('hidden');
        }

        function closeOrderModal() {
            document.getElementById('orderModal').classList.add('hidden');
        }

        function submitTransferOrder() {
            if (!selectedFromTable || !selectedToTable) {
                showToast("エラー", "移動元と移動先の両方の卓を選択してください");
                return;
            }

            if (selectedFromTable === selectedToTable) {
                showToast("警告", "移動元と移動先に同じ卓が選択されています");
                return;
            }

            let canvasData = null;
            let textNote = '';

            if (activeNoteMode === 'text') {
                textNote = document.getElementById('textNoteInput').value.trim();
            } else if (activeNoteMode === 'canvas' && hasCanvasContent(ticketCanvas)) {
                canvasData = ticketCanvas.toDataURL();
            }

            const newOrder = {
                no: genDisplayNo(),
                gender: selectedGender,
                fromTable: selectedFromTable,
                toTable: selectedToTable,
                item: '移動',
                createdAt: Date.now(),
                status: 'ACTIVE',
                noteType: activeNoteMode,
                canvasData,
                textNote
            };

            window.SyncApi.addOrder(newOrder);
            closeOrderModal();
            playChime('push');
            showToast("移動指示送信", `${selectedGender} 卓 ${selectedFromTable} ➔ 卓 ${selectedToTable} の移動指示を送信しました`);
        }

        // Canvas Controls
        function initModalCanvas() {
            ticketCanvas.addEventListener('pointerdown', startModalDraw);
            ticketCanvas.addEventListener('pointermove', modalDraw);
            ticketCanvas.addEventListener('pointerup', stopModalDraw);
            ticketCanvas.addEventListener('pointercancel', stopModalDraw);
        }

        function resizeModalCanvas() {
            const rect = ticketCanvas.parentElement.getBoundingClientRect();
            ticketCanvas.width = rect.width || 300;
            ticketCanvas.height = rect.height || 100;
            ticketCtx.lineCap = 'round';
            ticketCtx.lineJoin = 'round';
        }

        function getModalPt(e) {
            const rect = ticketCanvas.getBoundingClientRect();
            return { x: e.clientX - rect.left, y: e.clientY - rect.top };
        }

        function startModalDraw(e) {
            isDrawing = true;
            lastPt = getModalPt(e);
        }

        function modalDraw(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const currentPt = getModalPt(e);
            ticketCtx.beginPath();
            if (modalTool === 'eraser') {
                ticketCtx.globalCompositeOperation = 'destination-out';
                ticketCtx.lineWidth = modalPenWidth * 4;
            } else {
                ticketCtx.globalCompositeOperation = 'source-over';
                ticketCtx.strokeStyle = modalPenColor;
                ticketCtx.lineWidth = modalPenWidth;
            }
            ticketCtx.moveTo(lastPt.x, lastPt.y);
            ticketCtx.lineTo(currentPt.x, currentPt.y);
            ticketCtx.stroke();
            lastPt = currentPt;
        }

        function stopModalDraw() { isDrawing = false; }

        function setModalPenColor(color) {
            modalPenColor = color;
            setModalTool('pen');
            document.querySelectorAll('.modal-color-btn').forEach(btn => {
                if (btn.dataset.color === color) {
                    btn.classList.add('ring-2', 'ring-amber-400', 'ring-offset-1', 'ring-offset-slate-900');
                } else {
                    btn.classList.remove('ring-2', 'ring-amber-400', 'ring-offset-1', 'ring-offset-slate-900');
                }
            });
        }

        function setModalTool(tool) {
            modalTool = tool;
            const eraserBtn = document.getElementById('modalEraserBtn');
            eraserBtn.className = tool === 'eraser' ? "p-1 text-amber-400 bg-slate-800 rounded" : "p-1 text-slate-400 hover:text-slate-100 rounded";
        }

        function clearModalCanvas() {
            ticketCtx.clearRect(0, 0, ticketCanvas.width, ticketCanvas.height);
        }

        function hasCanvasContent(canvas) {
            const ctx = canvas.getContext('2d');
            const pixelBuffer = new Uint32Array(
                ctx.getImageData(0, 0, canvas.width, canvas.height).data.buffer
            );
            return pixelBuffer.some(color => color !== 0);
        }

        // Push Simulation Toggle
        function togglePushSimulation() {
            isSimulating = !isSimulating;
            const statusTxt = document.getElementById('simStatusText');
            const icon = document.getElementById('simIcon');

            if (isSimulating) {
                statusTxt.textContent = "ON";
                statusTxt.className = "font-bold text-amber-400";
                icon.className = "w-4 h-4 text-amber-400 animate-spin";
                simulateIncomingPush();
                autoPushInterval = setInterval(simulateIncomingPush, 8000);
            } else {
                statusTxt.textContent = "OFF";
                statusTxt.className = "font-bold text-slate-400";
                icon.className = "w-4 h-4 text-slate-400";
                if (autoPushInterval) clearInterval(autoPushInterval);
            }
        }

        function simulateIncomingPush() {
            if (registeredTables.length < 2) return;

            const fromIdx = Math.floor(Math.random() * registeredTables.length);
            let toIdx = Math.floor(Math.random() * registeredTables.length);
            if (toIdx === fromIdx) toIdx = (fromIdx + 1) % registeredTables.length;

            const fromTbl = registeredTables[fromIdx].name;
            const toTbl = registeredTables[toIdx].name;
            const simGender = Math.random() > 0.5 ? '男性' : '女性';
            const isText = Math.random() > 0.5;

            const newOrder = {
                no: genDisplayNo(),
                gender: simGender,
                fromTable: fromTbl,
                toTable: toTbl,
                item: '移動',
                createdAt: Date.now(),
                status: 'ACTIVE',
                noteType: isText ? 'text' : 'canvas',
                canvasData: !isText ? createSampleCanvasData('急ぎで移動願います', simGender === '男性' ? '#60a5fa' : '#f472b6') : null,
                textNote: isText ? 'お冷やカトラリーのセットも一緒にご用意ください' : ''
            };
            window.SyncApi.addOrder(newOrder);
            playChime('push');
            showToast("NEW TRANSFER ORDER", `${simGender} 卓 ${fromTbl} ➔ 卓 ${toTbl} 移動指示`);
        }

        function pad(n) { return n < 10 ? '0' + n : n; }
        function escapeHtml(s) {
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function showToast(title, msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastTitle').textContent = title;
            document.getElementById('toastMsg').textContent = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
    </script>

    <!-- ===== 端末間リアルタイム同期 (Firebase Firestore) ===== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import {
            initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
            collection, doc, onSnapshot, setDoc, updateDoc, addDoc
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // ▼▼▼ Firebase コンソールで取得した設定値に置き換えてください ▼▼▼
        const firebaseConfig = {
            apiKey: "AIzaSyACmpOTYMFEgeKPzcfion53fol2B_d9z1I",
            authDomain: "table-transfer-kds.firebaseapp.com",
            projectId: "table-transfer-kds",
            storageBucket: "table-transfer-kds.firebasestorage.app",
            messagingSenderId: "855779883186",
            appId: "1:855779883186:web:4e3e4b5b8cb6079c66f1ab"
        };
        // ▲▲▲ ここまで ▲▲▲

        const configured = !String(firebaseConfig.apiKey).startsWith('YOUR_');

        if (!configured) {
            // 未設定時はこの端末内だけで動作 (従来どおり)
            window.SyncApi = {
                addOrder(order) {
                    const o = { ...order, id: 'local-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7) };
                    applyRemoteOrders([o, ...orders]);
                },
                updateOrder(id, patch) {
                    applyRemoteOrders(orders.map(o => o.id === id ? { ...o, ...patch } : o));
                },
                saveTables(tables) {
                    applyRemoteTables(tables.map(t => ({ ...t })));
                }
            };
            setSyncStatus('local');
            showToast("Firebase未設定", "index.html の firebaseConfig を設定すると全端末で同期されます");
        } else {
            const app = initializeApp(firebaseConfig);
            // オフラインキャッシュ有効 (一時的に電波が切れても操作でき、復帰時に自動送信)
            const db = initializeFirestore(app, {
                localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
            });

            const ordersCol = collection(db, 'kds_orders');
            const tablesDoc = doc(db, 'kds_settings', 'tables');

            const onError = (label) => (e) => {
                console.error(label, e);
                setSyncStatus('error');
                showToast("同期エラー", e.code === 'permission-denied'
                    ? "Firestore のセキュリティルールを確認してください"
                    : (e.message || String(e)));
            };

            window.SyncApi = {
                addOrder(order) {
                    addDoc(ordersCol, order).catch(onError('addOrder'));
                },
                updateOrder(id, patch) {
                    updateDoc(doc(db, 'kds_orders', id), patch).catch(onError('updateOrder'));
                },
                saveTables(tables) {
                    setDoc(tablesDoc, { tables: tables.map(t => ({ name: t.name, colorId: t.colorId })) })
                        .catch(onError('saveTables'));
                }
            };

            // --- 卓設定の購読 (接続状態の判定にも使用) ---
            onSnapshot(tablesDoc, { includeMetadataChanges: true }, (snap) => {
                setSyncStatus(snap.metadata.fromCache ? (navigator.onLine ? 'connecting' : 'offline') : 'online');
                if (snap.exists()) {
                    applyRemoteTables((snap.data().tables || []).map(t => ({ ...t })));
                } else if (!snap.metadata.fromCache) {
                    // 初回のみ: サーバーに卓設定が無ければ初期値を作成
                    window.SyncApi.saveTables(DEFAULT_TABLES);
                }
            }, onError('tables'));

            // --- 移動オーダーの購読 ---
            let firstOrdersSnap = true;
            onSnapshot(ordersCol, (snap) => {
                if (!firstOrdersSnap) {
                    snap.docChanges().forEach(ch => {
                        if (ch.type !== 'added' || ch.doc.metadata.hasPendingWrites) return; // 自分の送信は除外
                        const o = ch.doc.data();
                        // 起動直後の取りこぼし分などで大量に鳴らないよう、直近1分以内のものだけ通知
                        if (o.status === 'ACTIVE' && Date.now() - (o.createdAt || 0) < 60 * 1000) {
                            notifyRemoteOrder(o);
                        }
                    });
                }
                firstOrdersSnap = false;
                applyRemoteOrders(snap.docs.map(d => ({ ...d.data(), id: d.id })));
            }, onError('orders'));

            window.addEventListener('offline', () => setSyncStatus('offline'));
            window.addEventListener('online', () => setSyncStatus('connecting'));
        }
    </script>
